name: Apify → Webflow Sync

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Run Apify (SYNC TASK)
        run: |
          DATA=$(curl -s -X POST \
            "https://api.apify.com/v2/actor-tasks/beatriz.cardoso~linkedin-profile-posts-task/run-sync-get-dataset-items?token=apify_api_ZyuoqNOva7Yfn2fG6JUDkAMpRHI3dh489O8E" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "$DATA" > posts.json

          echo "Preview:"
          cat posts.json

      - name: Send to Webflow CMS
        run: |
          set -e

          cat posts.json | jq -c '.[]' | while read post; do

            TITLE=$(echo "$post" | jq -r '
              .content
              | split("\n")[0]
              | split(".")[0]
              ' | xargs | cut -c1-256)
            URL=$(echo "$post" | jq -r '.linkedinUrl')

            echo "Posting: $TITLE"

            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              "https://api.webflow.com/v2/collections/69fb63b8ccb3ec3580dbbf43/items/live" \
              -H "Authorization: Bearer 1f78c7aac8b8dbcb6edd802d5440bef2f8963f4798a781de5a2de81e18a50a63" \
              -H "Content-Type: application/json" \
              -H "accept-version: 1.0.0" \
              -d "{
                \"isArchived\": false,
                \"isDraft\": false,
                \"fieldData\": {
                  \"name\": \"$TITLE\",
                  \"slug\": \"$(echo $URL | md5sum | cut -d' ' -f1)\",
                  \"post-url\": \"$URL\"
                }
              }")

            BODY=$(echo "$RESPONSE" | sed '$d')
            STATUS=$(echo "$RESPONSE" | tail -n1)

            echo "Webflow status: $STATUS"
            echo "Webflow response: $BODY"

            if [ "$STATUS" -ge 400 ]; then
              echo "❌ Webflow error detected. Stopping workflow."
              exit 1
            fi

          done
