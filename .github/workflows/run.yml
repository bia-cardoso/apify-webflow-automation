name: Apify → Webflow Sync

'on':
  schedule:
  - cron: "0 12 * * 1-5"
  workflow_dispatch: null

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Run Apify (SYNC TASK)
        run: |
          DATA=$(curl -s -X POST \
            "https://api.apify.com/v2/actor-tasks/beatriz.cardoso~linkedin-profile-posts-task/run-sync-get-dataset-items?token=apify_api_ZyuoqNOva7Yfn2fG6JUDkAMpRHI3dh489O8E" \
            -H "Content-Type: application/json" \
            -d '{}')
    
          echo "$DATA" > posts.json
    
          echo "Preview:"
          cat posts.json
    
      - name: Send to Webflow CMS
        run: |
          set -e

          echo "Loading last 5 Webflow items..."

          EXISTING=$(curl -s \
            "https://api.webflow.com/v2/collections/69fb63b8ccb3ec3580dbbf43/items?sortBy=lastPublished&sortOrder=desc&limit=5" \
            -H "Authorization: Bearer c1569fb118524c5facc93ac79c7e15a2a90c78570aa9c75a3d61c8ae7087805d" \
            -H "accept-version: 1.0.0")
          
          echo "Recent Webflow URLs:"
          echo "$EXISTING" | jq -r '.items[]?.fieldData["post-url"]'

    
          jq -c '.[]' posts.json | while IFS= read -r post; do
    
            TITLE=$(echo "$post" | jq -r '.content | split("\n")[0]' \
              | tr -d '\r' \
              | sed 's/\xC2\xA0/ /g' \
              | awk -F'\n' '{print $1}' \
              | xargs \
              | cut -c1-256)
    
            URL=$(echo "$post" | jq -r '.linkedinUrl')

            FOUND=$(echo "$EXISTING" | jq -r --arg url "$URL" '
              .items[]?
              | select(.fieldData["post-url"] == $url)
              | .id
            ')
            
            if [ -n "$FOUND" ]; then
              echo "⛔ Duplicate detected in the last 5 Webflow items — skipping: $URL"
              continue
            fi

           

            FOUND=$(echo "$EXISTING" | jq -r --arg url "$URL" '
              .items[]? | select(.fieldData["post-url"] == $url) | .id')

            if [ -n "$FOUND" ]; then
              echo "⛔ Duplicate detected (last 5 Webflow items) — skipping: $URL"
              continue
            fi

            CONTENT=$(echo "$post" | jq -r '.content')
            DATE=$(echo "$post" | jq -r '.postedAt.date')
            IMAGE=$(echo "$post" | jq -r '.postImages[0].url // empty')
    
            # 🔥 escape for JSON
            TITLE_JSON=$(printf '%s' "$TITLE" | jq -R .)
            URL_JSON=$(printf '%s' "$URL" | jq -R .)
            CONTENT_JSON=$(printf '%s' "$CONTENT" | jq -Rs .)
            DATE_JSON=$(printf '%s' "$DATE" | jq -R .)
            if [ -n "$IMAGE" ]; then
              IMAGE_JSON=$(printf '%s' "$IMAGE" | jq -R .)
            else
              IMAGE_JSON="null"
            fi
    
            echo "Posting (CLEAN): $TITLE"
            echo "Length: ${#TITLE}"

            echo "================ DEBUG ITEM ================"
            echo "TITLE: $TITLE"
            echo "URL: $URL"
            echo "DATE: $DATE"
            echo "IMAGE RAW: $IMAGE"
            echo "============================================"
                
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              "https://api.webflow.com/v2/collections/69fb63b8ccb3ec3580dbbf43/items" \
              -H "Authorization: Bearer c1569fb118524c5facc93ac79c7e15a2a90c78570aa9c75a3d61c8ae7087805d" \
              -H "Content-Type: application/json" \
              -H "accept-version: 1.0.0" \
              -d "{
                \"isDraft\": false,
                \"fieldData\": {
                  \"name\": $TITLE_JSON,
                  \"slug\": $(echo "$URL" | md5sum | cut -d' ' -f1 | jq -R .),
                  \"post-url\": $URL_JSON,
                  \"content\": $CONTENT_JSON,
                  \"date\": $DATE_JSON,
                  \"image\": $IMAGE_JSON
                }
              }")
    
            BODY=$(echo "$RESPONSE" | sed '$d')
            STATUS=$(echo "$RESPONSE" | tail -n1)
            ITEM_ID=$(echo "$BODY" | jq -r '.id // empty')            

            if [ -n "$ITEM_ID" ]; then
              # Update the cached last-5 list so duplicates in the same run are avoided
              EXISTING=$(echo "$EXISTING" | jq \
                --arg id "$ITEM_ID" \
                --arg url "$URL" \
                '.items |= ([{
                  id: $id,
                  fieldData: {"post-url": $url}
                }] + .)[:5]')
            
              curl -s -X POST \
                "https://api.webflow.com/v2/collections/69fb63b8ccb3ec3580dbbf43/items/publish" \
                -H "Authorization: Bearer c1569fb118524c5facc93ac79c7e15a2a90c78570aa9c75a3d61c8ae7087805d" \
                -H "Content-Type: application/json" \
                -H "accept-version: 1.0.0" \
                -d "{
                  \"itemIds\": [\"$ITEM_ID\"]
                }"
            fi
           
            echo "$RESPONSE"
            echo "Status: $STATUS"
            echo "$BODY"
    
          done
