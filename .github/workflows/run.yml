name: Apify → Webflow Sync

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Run Apify Actor
        id: apify
        run: |
          RESPONSE=$(curl -s -X POST "https://api.apify.com/v2/acts/A3cAPGpwBEG8RJwse/runs?token=apify_api_ZyuoqNOva7Yfn2fG6JUDkAMpRHI3dh489O8E")

          RUN_ID=$(echo $RESPONSE | jq -r '.data.id')
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Wait for Apify to finish
        run: |
          echo "Waiting for Apify run..."

          while true; do
            STATUS=$(curl -s "https://api.apify.com/v2/actor-runs/${{ env.RUN_ID }}?token=apify_api_ZyuoqNOva7Yfn2fG6JUDkAMpRHI3dh489O8E" | jq -r '.data.status')

            echo "Status: $STATUS"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              break
            fi

            sleep 10
          done

      - name: Get dataset items
        id: dataset
        run: |
          DATA=$(curl -s "https://api.apify.com/v2/actor-runs/${{ env.RUN_ID }}/dataset/items?token=apify_api_ZyuoqNOva7Yfn2fG6JUDkAMpRHI3dh489O8E")

          echo "$DATA" > posts.json

      - name: Send to Webflow CMS
        run: |
          set -e

          cat posts.json | jq -c '.[]' | while read post; do

            TITLE=$(echo $post | jq -r '.text // "No title"')
            URL=$(echo $post | jq -r '.url')

            echo "Posting: $TITLE"

            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              "https://api.webflow.com/collections/69fb63b8ccb3ec3580dbbf43/items" \
              -H "Authorization: Bearer 1f78c7aac8b8dbcb6edd802d5440bef2f8963f4798a781de5a2de81e18a50a63" \
              -H "Content-Type: application/json" \
              -H "accept-version: 1.0.0" \
              -d "{
                \"fields\": {
                  \"name\": \"$TITLE\",
                  \"slug\": \"$(echo $URL | md5sum | cut -d' ' -f1)\",
                  \"post-url\": \"$URL\"
                }
              }")

            # Split response body + status code
            BODY=$(echo "$RESPONSE" | sed '$d')
            STATUS=$(echo "$RESPONSE" | tail -n1)

            echo "Webflow status: $STATUS"
            echo "Webflow response: $BODY"

            # Fail workflow if Webflow rejects request
            if [ "$STATUS" -ge 400 ]; then
              echo "❌ Webflow error detected. Stopping workflow."
              exit 1
            fi

          done
