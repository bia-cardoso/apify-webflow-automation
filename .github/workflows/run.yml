name: LinkedIn → Webflow Sync

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Run scraper
        run: node scraper.js

      - name: Debug output
        run: |
          echo "=== FILES IN DIRECTORY ==="
          ls -la
          echo "=== POSTS OUTPUT ==="
          if [ -f posts.json ]; then
            cat posts.json
          else
            echo "posts.json not found"
          fi
